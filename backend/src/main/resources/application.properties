spring.application.name=demo
server.port=8081

# --- MySQL datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urlshortener}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# create/update tables from the entity (fine for dev; use Flyway/Liquibase in prod)
spring.jpa.hibernate.ddl-auto=update

# log the SQL Hibernate runs, so you can see what the DB is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
